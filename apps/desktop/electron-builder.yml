appId: com.sisyphus.app
productName: Sisyphus
npmRebuild: false
directories:
  output: dist
files:
  - main.js
  - preload.js
  - profile.js
  - plugins/**
  - lib/**
  - prompts/**
  - smoke/**
  - frontend-dist/**
  - package.json
# The filesystem MCP server is spawned as a child process, so it cannot live
# inside the asar archive.
asarUnpack:
  - node_modules/@modelcontextprotocol/**
extraResources:
  - from: ../../services/python-host
    to: python-host
    filter:
      - app/**
      - runner.py
      - servers.json
      - requirements.txt
      - '!**/__pycache__'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Utility
